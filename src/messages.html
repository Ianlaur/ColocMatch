<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=portrait">
    <title>ColocMatch - Messages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/messages.css">
</head>
<body>
    <div class="app-container">
        <!-- Header/Navigation -->
        <header>
            <nav>
                <div class="logo">
                    <i class="fas fa-key"></i>
                    <span>ColocMatch</span>
                </div>
                <div class="nav-buttons">
                    <button class="notifications-btn" id="notificationsBtn">
                        <i class="fas fa-bell"></i>
                        <span class="badge">2</span>
                    </button>
                    <div class="user-profile-header">
                        <img src="20250429_2140_Jeune Homme Humain_simple_compose_01jt1h0tezf1avm9q9v81q1z6f.png" alt="Photo de profil" class="header-profile-img">
                        <span class="header-profile-name">Mon profil</span>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Vue Liste des Conversations -->
            <div class="conversations-view active" id="conversationsView">
                <div class="conversations-header">
                    <h2>Messages</h2>
                    <div class="search-container">
                        <input type="text" placeholder="Rechercher..." class="search-input" id="searchConversation">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                </div>
                
                <div class="messages-tabs">
                    <button class="messages-tab active" data-tab="all">Tous</button>
                    <button class="messages-tab" data-tab="unread">Non lus</button>
                    <button class="messages-tab" data-tab="matches">Nouveaux matchs</button>
                </div>
                
                <div class="conversations-list">
                    <!-- Les conversations seront générées dynamiquement ici -->
                </div>
            </div>
            
            <!-- Vue Conversation -->
            <div class="chat-view" id="chatView">
                <div class="chat-header">
                    <button class="back-btn" id="backToConversations">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-user-info">
                        <div class="chat-user-img">
                            <img src="" alt="Photo de profil" id="chatUserImg">
                        </div>
                        <div class="chat-user-details">
                            <h2 id="chatUserName"></h2>
                            <p id="chatUserStatus">En ligne</p>
                        </div>
                    </div>
                    <button class="chat-options-btn" id="chatOptionsBtn">
                        <i class="fas fa-ellipsis-v"></i>
                    </button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <!-- Les messages seront générés dynamiquement ici -->
                </div>

                <div class="chat-input-area">
                    <div class="attachment-btn">
                        <i class="fas fa-paperclip"></i>
                    </div>
                    <div class="chat-input-container">
                        <textarea class="chat-input" placeholder="Écrivez votre message..." id="messageInput" rows="1"></textarea>
                    </div>
                    <div class="send-btn" id="sendMessageBtn">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                </div>
            </div>

            <!-- Menu Options Chat -->
            <div class="chat-options-menu hidden" id="chatOptionsMenu">
                <button class="option-item">
                    <i class="fas fa-user"></i>
                    Voir le profil
                </button>
                <button class="option-item">
                    <i class="fas fa-home"></i>
                    Voir l'appartement
                </button>
                <button class="option-item">
                    <i class="fas fa-bell"></i>
                    Désactiver les notifications
                </button>
                <button class="option-item delete">
                    <i class="fas fa-trash"></i>
                    Supprimer la conversation
                </button>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item" data-tab="swipe">
                <i class="fas fa-home"></i>
                <span>Découvrir</span>
            </button>
            <button class="nav-item active" data-tab="messages">
                <i class="fas fa-comments"></i>
                <span>Messages</span>
            </button>
            <button class="nav-item" data-tab="favorites">
                <i class="fas fa-star"></i>
                <span>Favoris</span>
            </button>
            <button class="nav-item" data-tab="profile">
                <i class="fas fa-user"></i>
                <span>Profil</span>
            </button>
        </nav>
    </div>

    <script src="js/data.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
