<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColocMatch - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-key"></i>
                <span>ColocMatch</span>
            </div>
            <div class="profile-preview">
                <img src="20250429_2140_Jeune Homme Humain_simple_compose_01jt1h0tezf1avm9q9v81q1z6f.png" alt="Profil par défaut" class="header-profile-img">
            </div>
            <h1>Trouve ton <span class="highlight">coloc idéal</span> en un swipe</h1>
            <p>Une app de rencontre, mais pour trouver ton futur colocataire et ton appart de rêve.</p>
        </div>

        <div class="login-card">
            <div class="tabs">
                <button class="tab active" data-tab="login">Connexion</button>
                <button class="tab" data-tab="signup">Inscription</button>
            </div>

            <div class="tab-content">
                <div class="tab-pane active" id="login-pane">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" placeholder="exemple@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Mot de passe</label>
                            <div class="password-field">
                                <input type="password" id="loginPassword" placeholder="Votre mot de passe" required>
                                <button type="button" class="toggle-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group remember-forgot">
                            <label class="checkbox-label">
                                <input type="checkbox" id="rememberMe">
                                <span>Se souvenir de moi</span>
                            </label>
                            <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                        </div>
                        <button type="submit" class="btn-primary btn-full">Se connecter</button>
                    </form>
                    <div class="social-login">
                        <p>Ou se connecter avec</p>
                        <div class="social-buttons">
                            <button class="social-btn google">
                                <i class="fab fa-google"></i>
                                Google
                            </button>
                            <button class="social-btn facebook">
                                <i class="fab fa-facebook-f"></i>
                                Facebook
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tab-pane" id="signup-pane">
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="signupName">Nom complet</label>
                            <input type="text" id="signupName" placeholder="Prénom et Nom" required>
                        </div>
                        <div class="form-group">
                            <label for="signupEmail">Email</label>
                            <input type="email" id="signupEmail" placeholder="exemple@email.com" required>
                        </div>
                        <div class="form-group">
                            <label for="signupPassword">Mot de passe</label>
                            <div class="password-field">
                                <input type="password" id="signupPassword" placeholder="Minimum 8 caractères" required>
                                <button type="button" class="toggle-password">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-group terms">
                            <label class="checkbox-label">
                                <input type="checkbox" id="acceptTerms" required>
                                <span>J'accepte les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a></span>
                            </label>
                        </div>
                        <button type="submit" class="btn-primary btn-full">S'inscrire</button>
                    </form>
                    <div class="social-login">
                        <p>Ou s'inscrire avec</p>
                        <div class="social-buttons">
                            <button class="social-btn google">
                                <i class="fab fa-google"></i>
                                Google
                            </button>
                            <button class="social-btn facebook">
                                <i class="fab fa-facebook-f"></i>
                                Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-footer">
            <p>© 2025 ColocMatch. Tous droits réservés.</p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
